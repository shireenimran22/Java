<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
</head>
<body>

<div class="p-5 h-screen bg-gray-100">
    <a href="/clients/create" class="text-sm btn btn-primary">Create</a>
    <table class="w-full">
        <thead class="bg-gray-50 border-b-2 border-gray-50">
        <tr>
            <th class="p-3 text-sm font-semibold tracking-wide text-left">ID</th>
            <th class="p-3 text-sm font-semibold tracking-wide text-left">Email</th>
            <th class="p-3 text-sm font-semibold tracking-wide text-left">Phone</th>
            <th class="p-3 text-sm font-semibold tracking-wide text-left">Address</th>
            <th class="p-3 text-sm font-semibold tracking-wide text-left">Status</th>
            <th class="p-3 text-sm font-semibold tracking-wide text-left">CreatedAt</th>
            <th class="p-3 text-sm font-semibold tracking-wide text-left">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr class="bg-white " th:each=" client : ${clients}">

            <td class="p-3 text-sm text-gray-700" th:text="${client.id}"></td>
            <td class="p-3 text-sm text-gray-700" th:text="${client.email}"></td>
            <td class="p-3 text-sm text-gray-700" th:text="${client.phone}"></td>
            <td class="p-3 text-sm text-gray-700" th:text="${client.address}"></td>
            <td class="p-3 text-sm text-gray-700" th:text="${client.state}"></td>
            <td class="p-3 text-sm text-gray-700">-</td>
            <td class="p-3 text-sm text-gray-700">
                <a th:href="@{edit(id=${client.id})}" class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-transparent rounded">
                    Edit
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
